name: Android CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: 1. ZIP 파일 통째로 압축 풀기
      run: unzip -o *.zip
      
    - name: 2. 자바(JDK) 17 최신버전으로 세팅
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. 딱 맞는 버전의 Gradle(조립기) 설치
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'
        
    - name: 4. 버전 충돌 버그 자동 수정 및 앱 조립!
      run: |
        TARGET_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
        cd "$TARGET_DIR"
        
        find . -type f -name "build.gradle*" -exec sed -i 's/"1.5.1"/"1.5.3"/g' {} +
        
        gradle assembleDebug
        
    - name: 5. 완성된 APK 파일 추출하기
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/*.apk"

