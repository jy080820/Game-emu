name: Android CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: 1. ZIP 파일 통째로 압축 풀기
      run: unzip -o *.zip
      
    - name: 2. 자바(JDK) 17 최신버전으로 세팅
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. 호환성 에러 없는 딱 맞는 버전의 Gradle(조립기) 설치
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'
        
    - name: 4. 폴더 찾아서 앱 조립 시작!
      run: |
        # 진짜 메인 설정 파일이 있는 곳을 똑똑하게 찾아서 이동합니다.
        TARGET_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
        cd "$TARGET_DIR"
        
        # gradlew가 없어도, 방금 설치한 조립기로 무조건 실행되게 합니다.
        gradle assembleDebug
        
    - name: 5. 완성된 APK 파일 추출하기
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/*.apk"
