name: Android CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: 1. ZIP 파일 압축 통째로 풀기
      run: unzip -o *.zip
      
    - name: 2. 자바(JDK) 17 설치
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 3. 내장된 맞춤 조립기에 실행 권한 주고 조립 시작!
      run: |
        TARGET_DIR=$(dirname $(find . -name "build.gradle*" | head -n 1))
        if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
        cd "$TARGET_DIR"
        
        # 권한을 부여하고 내장된 조립기(gradlew)를 실행합니다.
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: 4. 완성된 APK 추출하기
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/*.apk"
