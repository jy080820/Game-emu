name: Android CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: 1. ZIP 파일 통째로 압축 풀기
      run: unzip -o *.zip
      
    - name: 2. 자바(JDK) 17 최신버전으로 세팅
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. 딱 맞는 버전의 Gradle(조립기) 설치
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'
        
    - name: 4. 권한 및 보안 해제 자동 코드 주입 후 조립!
      run: |
        TARGET_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
        cd "$TARGET_DIR"
        
        # 1. 버전 충돌 버그 수정 (기존)
        find . -type f -name "build.gradle*" -exec sed -i 's/"1.5.1"/"1.5.3"/g' {} +
        
        # 2. Manifest 파일에 인터넷 및 모든 파일 권한 강제 주입!
        find . -type f -name "AndroidManifest.xml" -exec sed -i 's/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>/g' {} +
        
        # 3. HtmlEngine 파일에 로컬 파일 접근 보안 해제 코드 강제 주입!
        find . -type f -name "HtmlEngine.kt" -exec sed -i 's/setSupportZoom(false)/setSupportZoom(false)\n                    allowFileAccessFromFileURLs = true\n                    allowUniversalAccessFromFileURLs = true/g' {} +
        
        # 수정 완료 후 무사히 조립 시작
        gradle assembleDebug
        
    - name: 5. 완성된 APK 파일 추출하기
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/*.apk"
