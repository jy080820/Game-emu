name: Android CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: 1. ZIP 파일 압축 통째로 풀기
      run: unzip -o *.zip
      
    - name: 2. 자바(JDK) 17 설치
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 3. 자동으로 프로젝트 폴더 찾아서 앱 조립하기 (Gradle)
      run: |
        TARGET_DIR=$(dirname $(find . -name "build.gradle*" | head -n 1))
        if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
        cd "$TARGET_DIR"
        gradle assembleDebug
        
    - name: 4. 완성된 APK 추출하기
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/*.apk"
