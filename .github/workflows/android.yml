name: Android CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: 1. ZIP 파일 통째로 압축 풀기
      run: unzip -o *.zip
      
    - name: 2. 자바(JDK) 17 최신버전으로 세팅
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. 딱 맞는 버전의 Gradle(조립기) 설치
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'
        
    - name: 4. 보안 해제 엔진으로 완전 교체 및 조립!
      run: |
        TARGET_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
        cd "$TARGET_DIR"
        
        # 권한 및 버전 충돌 버그 수정
        find . -type f -name "build.gradle*" -exec sed -i 's/"1.5.1"/"1.5.3"/g' {} +
        find . -type f -name "AndroidManifest.xml" -exec sed -i 's/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>/g' {} +
        
        # [핵심] HtmlEngine.kt 파일을 보안이 완전 해제된 코드로 통째로 덮어씁니다!
        HTML_FILE=$(find . -type f -name "HtmlEngine.kt" | head -n 1)
        cat << 'EOF' > "$HTML_FILE"
        package com.example.gameemu

        import android.annotation.SuppressLint
        import android.webkit.WebSettings
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import android.webkit.WebChromeClient
        import androidx.compose.runtime.Composable
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.viewinterop.AndroidView

        @SuppressLint("SetJavaScriptEnabled")
        @Composable
        fun HtmlGameScreen(filePath: String, modifier: Modifier = Modifier) {
            AndroidView(
                modifier = modifier,
                factory = { context ->
                    WebView(context).apply {
                        webViewClient = WebViewClient()
                        webChromeClient = WebChromeClient()
                        settings.apply {
                            javaScriptEnabled = true
                            domStorageEnabled = true
                            databaseEnabled = true
                            allowFileAccess = true
                            allowContentAccess = true
                            allowFileAccessFromFileURLs = true
                            allowUniversalAccessFromFileURLs = true
                            mediaPlaybackRequiresUserGesture = false
                            setSupportZoom(false)
                            useWideViewPort = true
                            loadWithOverviewMode = true
                            mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                        }
                        clearCache(true)
                        loadUrl("file://$filePath")
                    }
                }
            )
        }
        EOF
        
        # 무사히 조립 시작
        gradle assembleDebug
        
    - name: 5. 완성된 APK 파일 추출하기
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/*.apk"
        
        # 수정 완료 후 무사히 조립 시작
        gradle assembleDebug
        
    - name: 5. 완성된 APK 파일 추출하기
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/*.apk"
